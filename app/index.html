<title>POP Lanches e Pizzas — prévia do app v10 (ZELES)</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#F62A25; --red-d:#C72017; --ink:#1a1414; --ink2:#645c58; --line:#eadfd5;
  --bg:#f6f6f4; --card:#ffffff; --green:#13994B; --yellow:#13994B; --gold:#CD9143;
  --ex:#7a4dff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#efe7de;color:var(--ink);font:14.5px/1.4 "Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:90px;box-shadow:0 0 40px rgba(0,0,0,.06)}
/* selo + troca de visão */
.demo-strip{background:#171212;color:#d8cfc8;font-size:10.5px;padding:5px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.1px}
.demo-strip b{color:#fff;font-weight:600}
.switch{display:flex;background:#2c2525;border-radius:999px;padding:2px;flex:none}
.switch button{border:0;background:transparent;color:#cfc7c0;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.switch button.on{background:var(--red);color:#fff}
/* hero */
.hero{background:radial-gradient(120% 140% at 0% 0%,#ff4a3d 0%,#F62A25 45%,#c91d17 100%);color:#fff;padding:18px 16px 16px;position:relative;overflow:hidden}
.hero .deco{position:absolute;right:-70px;top:-26px;width:190px;height:190px;opacity:.95;transform:rotate(-14deg);filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.brand{display:flex;gap:12px;align-items:center;position:relative;z-index:1}
.logo{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-weight:900;font-size:19px;letter-spacing:-.8px;border:3px solid #171212;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.brand h1{margin:0;font-size:21px;line-height:1.05;font-weight:800;letter-spacing:-.3px}
.brand small{opacity:.92;font-size:12px}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1;max-width:300px}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:11.5px;white-space:nowrap;backdrop-filter:blur(2px)}
.pill.open{background:#fff;color:var(--green);font-weight:700}
.pill.paused{background:#171212;color:var(--yellow);font-weight:700}
.banner{margin:12px 16px 0;background:#171212;color:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px}
/* busca */
.search{margin:14px 16px 0;position:relative}
.search input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px 11px 38px;font:inherit;background:#fff;color:var(--ink)}
.search:before{content:"";position:absolute;left:13px;top:50%;width:13px;height:13px;border:2px solid #a39891;border-radius:50%;transform:translateY(-62%)}
.search:after{content:"";position:absolute;left:25px;top:57%;width:7px;height:2px;background:#a39891;transform:rotate(45deg)}
/* carrossel de promoções */
.promos{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.promos::-webkit-scrollbar{display:none}
.promo{flex:none;width:82%;scroll-snap-align:start;border-radius:16px;padding:14px;position:relative;overflow:hidden;color:#fff;min-height:128px;border:0;text-align:left}
.promo h3{margin:0;font-size:17px;line-height:1.15;font-weight:800;max-width:62%}
.promo p{margin:5px 0 0;font-size:12px;opacity:.92;max-width:60%}
.promo .art{position:absolute;right:-8px;bottom:-10px;width:118px;height:118px}
.promo .kick{display:inline-block;background:var(--yellow);color:#171212;font-weight:800;font-size:10.5px;border-radius:6px;padding:1px 7px;margin-bottom:6px;letter-spacing:.3px}
.promo .price{margin-top:8px;font-weight:800;font-size:16px}
.promo .price s{opacity:.7;font-weight:500;font-size:12px;margin-right:4px}
.promo.p1{background:linear-gradient(135deg,#171212,#3a2522)}
.promo.p2{background:linear-gradient(135deg,#F62A25,#ff7b32)}
.promo.p3{background:linear-gradient(135deg,#13994B,#0f7a3c)}
.promo.p4{background:linear-gradient(135deg,#5A1E63,#8a3597)}
/* destaques */
.hl-title{padding:16px 16px 0;margin:0;font-size:16px;font-weight:800}
.hls{display:flex;gap:10px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
.hls::-webkit-scrollbar{display:none}
.hl{flex:none;width:138px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;color:inherit;position:relative}
.hl .pic{height:92px;border-radius:12px;display:grid;place-items:center;margin-bottom:8px}
.hl .pic svg{width:82px;height:82px}
.hl b{display:block;font-size:13px;line-height:1.2;min-height:31px}
.hl .pr{font-weight:800;font-size:14px;margin-top:4px;color:var(--red-d)}
/* categorias */
.cats{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 12px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:10px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;color:var(--ink)}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
section.cat-sec{padding:4px 16px 2px}
section.cat-sec h2{font-size:17px;margin:16px 0 2px;font-weight:800;letter-spacing:-.2px}
section.cat-sec .sub{font-size:12px;color:var(--ink2);margin:0 0 10px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;align-items:center;width:100%;text-align:left;color:inherit;position:relative}
.item:disabled{opacity:.5;cursor:not-allowed}
.item .txt{flex:1;min-width:0}
.item h3{margin:0 0 2px;font-size:14.5px;font-weight:700;line-height:1.25}
.item p{margin:0;color:var(--ink2);font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .price{margin-top:6px;font-weight:800;font-size:14.5px}
.item .price small{font-weight:500;color:var(--ink2);font-size:11.5px}
.item .price s{color:#a39891;font-weight:500;font-size:12px;margin-left:4px}
.thumb{width:86px;height:86px;border-radius:14px;display:grid;place-items:center;flex:none;position:relative}
.thumb svg{width:74px;height:74px;filter:drop-shadow(0 4px 5px rgba(80,30,10,.18))}
.bg-l{background:linear-gradient(135deg,#ffe6cf,#ffd0a8)} .bg-p{background:linear-gradient(135deg,#ffe0d8,#ffc4b4)} .bg-d{background:linear-gradient(135deg,#f3e2d6,#e7cbb6)}
.bg-o{background:linear-gradient(135deg,#fff1c9,#ffe19a)} .bg-c{background:linear-gradient(135deg,#ffe3e1,#ffcdc9)} .bg-a{background:linear-gradient(135deg,#f0e0f5,#e0c3ea)} .bg-b{background:linear-gradient(135deg,#dff2fb,#c7e6f5)}
.tag{display:inline-block;border-radius:6px;font-size:10px;font-weight:800;padding:1px 6px;margin-bottom:3px;letter-spacing:.3px;text-transform:uppercase}
.tag.mais{background:#fff0d6;color:#9a5b00} .tag.novo{background:#e3f6ea;color:#0f7a3c} .tag.pr{background:var(--red);color:#fff}
.tag-esg{display:inline-block;background:#171212;color:#fff;border-radius:6px;font-size:10px;font-weight:800;padding:1px 6px;margin-left:4px;vertical-align:1px}
.add{position:absolute;right:10px;bottom:10px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;line-height:1}
.fonte{font-size:10.5px;color:#9a8f88;margin:14px 16px 0;line-height:1.45;text-align:center}
/* barra do carrinho */
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:calc(100% - 24px);max-width:456px;background:var(--red);color:#fff;border:0;border-radius:16px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;box-shadow:0 10px 26px rgba(199,32,23,.38);z-index:20}
.cartbar .n{background:#fff;color:var(--red);border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px;margin-right:8px;padding:0 6px;font-weight:800}
/* telas internas */
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
.top button.back{border:0;background:#f3ece6;border-radius:10px;width:36px;height:36px;font-size:18px}
.top h2{margin:0;font-size:16.5px;font-weight:700}
.pad{padding:14px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.rule{font-size:10.5px;font-weight:700;color:var(--ink2);background:#f3ece6;border-radius:6px;padding:2px 7px;white-space:nowrap}
.rule.req{background:#171212;color:#fff}
.opt{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-top:1px solid #f3ece6;font-size:14px;gap:10px}
.opt:first-of-type{border-top:0}
.opt small{color:var(--ink2);font-size:12px}
.opt .r{margin-left:auto;color:var(--ink2);font-size:12.5px;white-space:nowrap}
.opt input{width:20px;height:20px;accent-color:var(--red);flex:none}
.hero-p{height:210px;display:grid;place-items:center;position:relative}
.hero-p svg{width:170px;height:170px;filter:drop-shadow(0 12px 14px rgba(80,30,10,.25))}
textarea,input[type=text],input[type=tel],select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:800}
.big{width:100%;border:0;border-radius:16px;padding:14px;font-weight:700;font-size:15px;background:var(--red);color:#fff;display:flex;justify-content:space-between;align-items:center}
.big.center{justify-content:center}
.big.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.big.green{background:var(--green)}
.big:disabled{background:#cbbfb6;cursor:not-allowed}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.row.tot{font-weight:800;font-size:16px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.row .free{color:var(--green);font-weight:700}
.line-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid #f3ece6;align-items:center}
.line-item:first-child{border-top:0}
.line-item .d{flex:1;font-size:14px}
.line-item .d small{display:block;color:var(--ink2);font-size:12px}
.line-item .v{font-weight:700;font-size:13.5px;white-space:nowrap}
.mini{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none}
.mini svg{width:38px;height:38px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;font-weight:700;text-align:center}
.pay button small{display:block;font-weight:500;color:var(--ink2);font-size:11px;margin-top:2px}
.pay button.on{border-color:var(--red);background:#fff4f2}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13.5px}
.checks li b{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:var(--green)}
.checks li.no b{background:var(--red)}
.checks li.no{color:var(--red-d);font-weight:700}
.sim{position:relative}
.sim:after{content:"SIMULAÇÃO";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:26px;letter-spacing:2px;color:rgba(246,42,37,.8);transform:rotate(-18deg);pointer-events:none;text-shadow:0 0 6px #fff,0 0 2px #fff}
.qr{width:200px;height:200px;margin:6px auto;display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.copy{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f3ece6;border-radius:8px;padding:8px;word-break:break-all;color:#6b625c}
.note{font-size:12px;color:var(--ink2);margin:6px 0 0}
.fake{border:1.5px dashed #d6ccc4;border-radius:10px;padding:10px 12px;color:#b3a89f;background:#faf7f4;margin-bottom:8px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
/* estados do pedido */
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{display:flex;gap:12px;padding:0 0 16px;position:relative}
.steps li:before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child:before{display:none}
.steps .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;color:#b3a89f;z-index:1}
.steps li.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.steps li.now .dot{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 5px rgba(246,42,37,.18)}
.steps li.done:before{background:var(--green)}
.steps .t{font-weight:700;font-size:14px}
.steps .s{font-size:12px;color:var(--ink2)}
.steps li.fut .t{color:#b3a89f}
.eta{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#F62A25,#ff7b32);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.eta b{font-size:24px;font-weight:800;display:block;line-height:1}
.eta small{opacity:.9;font-size:12px}
/* gestão */
.g-head{background:#171212;color:#fff;padding:14px 16px 16px}
.g-head h1{margin:0;font-size:18px;font-weight:800}
.g-head p{margin:3px 0 0;font-size:12px;color:#cfc7c0}
.g-live{display:flex;gap:8px;margin-top:12px}
.g-live div{flex:1;background:#2a2222;border-radius:12px;padding:8px 10px}
.g-live b{display:block;font-size:16px;font-weight:800;white-space:nowrap}
.g-live span{font-size:10.5px;color:#cfc7c0}
.ex-banner{margin:14px 16px 0;background:#efe9ff;border:1px dashed #b9a4ff;color:#4b2fb3;border-radius:12px;padding:9px 12px;font-size:12px}
.ex{display:inline-block;background:#efe9ff;color:var(--ex);border:1px dashed #b9a4ff;border-radius:6px;padding:0 5px;font-size:9.5px;font-weight:800;vertical-align:1px}
.chips{display:flex;gap:8px;padding:12px 16px 0}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.kpi .l{font-size:11.5px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:20px;font-weight:800;margin-top:1px;letter-spacing:-.3px}
.kpi .s{font-size:11px;color:var(--ink2)}
.up{color:var(--green);font-weight:700} .down{color:var(--red-d);font-weight:700}
.g-sec{padding:0 16px}
.g-sec h2{font-size:15px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.g-sec h2 small{font-weight:500;font-size:11px;color:var(--ink2)}
.bars .b{display:grid;grid-template-columns:128px 1fr 54px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.bars .b .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .track{height:12px;background:#f3ece6;border-radius:6px;overflow:hidden}
.bars .fill{height:100%;background:var(--red);border-radius:6px}
.bars .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:6px}
.vbars.thin{gap:2px}
.vbars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vbars .c i{display:block;width:100%;background:var(--red);border-radius:4px 4px 0 0;min-height:2px}
.vbars.thin .c i{background:#f08a86;border-radius:2px 2px 0 0}
.vbars .c.pk i{background:var(--red-d)}
.vbars .c span{font-size:10px;color:var(--ink2);margin-top:4px;white-space:nowrap;height:13px}
.vbars .c em{font-style:normal;font-size:10px;font-weight:700;margin-bottom:2px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;color:var(--ink2);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line);font-size:11px}
table.t td{padding:7px 4px;border-bottom:1px solid #f3ece6;font-variant-numeric:tabular-nums}
table.t td.r,table.t th.r{text-align:right}
.ctl{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #f3ece6;font-size:13.5px;gap:10px}
.ctl:first-of-type{border-top:0}
.tog{width:48px;height:28px;border-radius:999px;background:#d6ccc4;border:0;position:relative;flex:none}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--green)}
.tog.on:after{left:23px}
.tog.red.on{background:#171212}
.ord{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fff}
.ord.ring{border-color:var(--red);box-shadow:0 0 0 3px rgba(246,42,37,.15);animation:ring 1.2s infinite}
@keyframes ring{50%{box-shadow:0 0 0 6px rgba(246,42,37,.05)}}
.ord .h{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;gap:8px}
.ord .m{font-size:12px;color:var(--ink2);margin:3px 0 8px}
.ord .acts{display:flex;gap:6px;flex-wrap:wrap}
.ord .acts button{border:0;border-radius:9px;padding:7px 11px;font-weight:700;font-size:12px;background:var(--ink);color:#fff}
.ord .acts button.ok{background:var(--green)}
.ord .acts button.x{background:#fff;color:var(--red-d);border:1.5px solid #f3c3bf}
.st{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;background:#f3ece6;color:var(--ink2)}
.st.pago{background:#fff4f2;color:var(--red-d)} .st.aceito,.st.cozinha{background:#fff7dc;color:#8a6500} .st.saiu{background:#e6f4ff;color:#0b5ea8} .st.entregue{background:#e5f6ec;color:var(--green)} .st.cancelado{background:#eee;color:#777}
.funnel .fs{display:grid;grid-template-columns:118px 1fr 50px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.funnel .fs .track{height:18px;background:#f3ece6;border-radius:5px;overflow:hidden}
.funnel .fs .fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.foot{font-size:11px;color:#8b817a;padding:18px 16px 8px;line-height:1.5}
.selo-pe{margin:18px 16px 0;border:1px dashed #cdbfb3;border-radius:12px;padding:10px 12px;font-size:11px;color:#8b817a;text-align:center;line-height:1.45}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#171212;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:50;max-width:90%;display:none}
.hidden{display:none!important}
/* ======================= v3 — CARA DO APP (sobrepõe o v2) ======================= */
:root{ --serif:"Poppins","Inter",system-ui,sans-serif; --dark:#1a1414; --dark2:#241b19; }
body{background:#2a201e;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14.5px}
.app{max-width:420px;padding-bottom:112px;overflow:clip;box-shadow:none}
@media (min-width:520px){
  body{background:radial-gradient(120% 90% at 50% 0%,#3a2a27 0%,#1b1413 70%)}
  .app{margin:24px auto;border-radius:34px;min-height:calc(100vh - 48px);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 10px #0e0a0a}
}
.demo-strip{background:#0f0b0b;color:#cfc4bb;font-size:10.5px;padding:6px 14px;justify-content:center;text-align:center}
.demo-strip .sw{border:0;background:var(--red);color:#fff;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;flex:none}
.demo-strip.g{justify-content:space-between;text-align:left}

/* ---------- topo: logo no centro, carrinho à direita, NENHUM menu ---------- */
.topo{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:10px 14px;background:transparent;transition:background .25s,box-shadow .25s}
.topo.solid,.topo.rolou{background:var(--dark);box-shadow:0 6px 18px rgba(0,0,0,.22)}
.marca{justify-self:center;text-align:center;line-height:1;border:0;background:none;padding:0;color:inherit}
.marca .pop{display:block;font-family:var(--serif);font-weight:900;font-size:29px;color:var(--yellow);text-shadow:2px 2px 0 var(--red),3.5px 3.5px 0 #000;letter-spacing:1.5px}
.marca small{display:block;font-size:8px;letter-spacing:2.8px;color:#f1e7dc;font-weight:700;margin-top:3px}
.cartbtn{justify-self:end;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;position:relative;display:grid;place-items:center}
.cartbtn svg{width:22px;height:22px}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--dark)}
.badge.zero{display:none}
.pula{animation:pula .5s}
@keyframes pula{30%{transform:scale(1.4)}60%{transform:scale(.88)}100%{transform:scale(1)}}
.voltar{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.voltar svg{width:20px;height:20px}
.topo h2{margin:0;justify-self:center;color:#fff;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- capa escura ---------- */
.capa{background:var(--dark);margin-top:-62px;padding:80px 18px 28px;position:relative;overflow:hidden;border-radius:0 0 30px 30px;color:#fff}
.capa:before{content:"";position:absolute;right:-150px;top:30px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(246,42,37,.5) 0%,rgba(246,42,37,.12) 45%,rgba(246,42,37,0) 68%)}
.capa:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(26,20,20,.96) 0%,rgba(26,20,20,.7) 48%,rgba(26,20,20,0) 72%);z-index:1;pointer-events:none}
.a-pizza{position:absolute;right:-118px;top:78px;width:290px;height:290px;animation:giraLento 60s linear infinite;filter:drop-shadow(0 22px 26px rgba(0,0,0,.65))}
.a-burger{position:absolute;right:-6px;top:236px;width:168px;height:168px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.6));z-index:1}
.a-pizza svg,.a-burger svg{width:100%;height:100%}
@keyframes giraLento{to{transform:rotate(360deg)}}
.capa-txt{position:relative;z-index:2;width:74%}
.rotulo{display:block;font-size:10.5px;letter-spacing:2.2px;color:var(--yellow);font-weight:700;text-transform:uppercase}
.capa h1{font-family:var(--serif);font-weight:800;font-size:32px;white-space:nowrap;line-height:1.02;margin:9px 0 10px;letter-spacing:-.6px}
.capa h1 em{font-style:normal;color:var(--yellow)}
.capa p{margin:0 0 18px;color:#e7dcd3;font-size:14px;line-height:1.4;max-width:215px}
.btn-p,.btn-s{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;max-width:212px;border-radius:13px;padding:13px 14px;font-weight:700;font-size:15px}
.btn-p{background:var(--red);color:#fff;border:0;box-shadow:0 10px 22px rgba(246,42,37,.38)}
.btn-s{background:rgba(26,20,20,.4);color:#fff;border:1.5px solid rgba(255,255,255,.55);margin-top:10px;font-weight:600}
.btn-p svg,.btn-s svg{width:18px;height:18px;flex:none}

/* ---------- categorias em cartões ---------- */
.catcards{display:flex;gap:10px;overflow-x:auto;padding:16px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.catcards::-webkit-scrollbar{display:none}
.cc{flex:none;width:82px;background:#fff;border:1.5px solid #efe4da;border-radius:16px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);scroll-snap-align:start;box-shadow:0 2px 6px rgba(80,40,20,.05);transition:transform .15s}
.cc:active{transform:scale(.95)}
.cc .cc-img{width:52px;height:46px;display:grid;place-items:center}
.cc .cc-img svg{width:50px;height:50px;filter:drop-shadow(0 3px 3px rgba(80,30,10,.18))}
.cc b{font-size:12.5px;font-weight:700}
.cc.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 6px 16px rgba(246,42,37,.2)}
.cc.on b{color:var(--red-d)}
.cardapio .catcards{position:sticky;top:62px;z-index:8;background:var(--bg);padding-bottom:12px;border-bottom:1px solid var(--line)}

/* ---------- pedir de novo ---------- */
.denovo{margin:16px 16px 0;background:#fff;border:1.5px dashed #f0b9b6;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
.dn-pics{display:flex;flex:none}
.dn-pics span{width:34px;height:34px;border-radius:50%;background:var(--dark);display:grid;place-items:center;border:2px solid #fff;margin-left:-12px}
.dn-pics span:first-child{margin-left:0}
.dn-pics svg{width:26px;height:26px}
.dn-t{flex:1;min-width:0}
.dn-t small{display:block;font-size:9.5px;letter-spacing:.8px;white-space:nowrap;color:var(--red-d);font-weight:800;text-transform:uppercase}
.dn-t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.25;margin-top:3px}
.dn-btn{flex:none;border:0;background:var(--dark);color:#fff;border-radius:12px;padding:10px 11px;font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center}
.dn-btn svg{width:15px;height:15px}

/* ---------- títulos de seção ---------- */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:22px 16px 0}
.sec-h h2{margin:0;font-family:var(--serif);font-weight:800;font-size:23px;letter-spacing:-.3px}
.sec-h button{border:0;background:none;color:var(--red-d);font-weight:700;font-size:13.5px;padding:0;display:flex;gap:5px;align-items:center}
.sec-h button svg{width:16px;height:16px}

/* ---------- mais pedidos ---------- */
.mp{display:flex;gap:11px;overflow-x:auto;padding:12px 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.mp::-webkit-scrollbar{display:none}
.mpc{flex:none;width:150px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(80,40,20,.08);scroll-snap-align:start;cursor:pointer;display:flex;flex-direction:column}
.mpc-img{height:112px;display:grid;place-items:center;background:radial-gradient(90% 90% at 50% 35%,#3a2a25 0%,var(--dark) 75%);position:relative}
.mpc-img svg{width:96px;height:96px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.mpc-img .tag{position:absolute;left:8px;top:8px;margin:0}
.mpc-b{padding:10px 11px 11px;display:flex;flex-direction:column;flex:1}
.mpc-b b{font-size:14px;line-height:1.2}
.mpc-b p{margin:4px 0 0;font-size:11.5px;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:46px}
.mpc-f{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:8px}
.mpc-f .pr{font-weight:800;font-size:15px;line-height:1.1}
.mpc-f .pr small{display:block;font-size:9.5px;font-weight:600;color:var(--ink2)}
.addb{width:34px;height:34px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 5px 12px rgba(246,42,37,.35);transition:transform .15s}
.addb:active{transform:scale(.85)}
.addb svg{width:18px;height:18px}

/* ---------- combo da semana ---------- */
.combo{margin:18px 16px 0;background:linear-gradient(120deg,#120d0d 0%,#2b1a17 100%);border-radius:20px;color:#fff;padding:16px;position:relative;overflow:hidden;min-height:150px;cursor:pointer}
.combo .cb-t{position:relative;z-index:2;width:60%}
.combo h3{font-family:var(--serif);font-weight:800;font-size:25px;margin:4px 0 4px;line-height:1.05}
.combo p{margin:0;font-size:12.5px;color:#e2d6cc;line-height:1.35}
.cb-f{display:flex;align-items:center;gap:10px;margin-top:12px}
.cb-f b{font-family:var(--serif);font-size:25px;color:var(--yellow);font-weight:800;white-space:nowrap}
.cb-f button{border:0;background:var(--red);color:#fff;border-radius:10px;padding:8px 11px;font-weight:700;font-size:12.5px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.cb-f button svg{width:14px;height:14px}
.cb-arte{position:absolute;right:-18px;bottom:-14px;width:170px;height:170px;z-index:1}
.cb-arte svg{width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.selo-r{position:absolute;right:12px;top:12px;z-index:3;width:66px;height:66px;border-radius:50%;background:var(--yellow);color:var(--dark);display:grid;place-items:center;text-align:center;font-size:8.5px;font-weight:800;line-height:1.05;letter-spacing:.4px;transform:rotate(12deg);box-shadow:0 6px 14px rgba(0,0,0,.35);border:2px dashed rgba(26,20,20,.35)}
.selo-r b{font-family:var(--serif);font-size:21px;display:block;line-height:1}

/* ---------- direto da cozinha ---------- */
.direto{margin:16px 16px 0;background:var(--yellow);color:var(--dark);border-radius:18px;padding:13px 14px;display:flex;gap:12px;align-items:center}
.direto .d-ic{width:42px;height:42px;border-radius:50%;background:var(--dark);color:var(--yellow);display:grid;place-items:center;flex:none}
.direto .d-ic svg{width:22px;height:22px}
.direto b{display:block;font-family:var(--serif);font-size:17px;font-weight:800;line-height:1.1}
.direto span{font-size:12.5px;line-height:1.35;display:block;margin-top:2px}

/* ---------- serviços ---------- */
.servicos{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 16px 0;background:#fff;border-radius:18px;padding:12px 4px;box-shadow:0 2px 8px rgba(80,40,20,.05)}
.servicos div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:0 6px;border-left:1px solid #efe4da}
.servicos div:first-child{border-left:0}
.servicos svg{width:26px;height:26px;color:var(--ink)}
.servicos b{font-size:12px;line-height:1.2}
.servicos small{font-size:10.5px;color:var(--ink2);line-height:1.25}

/* ---------- barra de baixo com a LUPA no meio ---------- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;z-index:40;background:var(--dark);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 6px calc(10px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.22)}
.nav button{border:0;background:none;color:#bfb3aa;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:4px 0;position:relative}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--yellow)}
.nav button .ponto{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid var(--dark)}
.nav .lupa i{width:62px;height:62px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;margin-top:-34px;border:5px solid var(--bg);box-shadow:0 10px 22px rgba(246,42,37,.45);transition:transform .15s}
.nav .lupa i svg{width:27px;height:27px}
.nav .lupa:active i{transform:scale(.92)}
.nav .lupa.on i{background:var(--yellow);color:var(--dark)}
.nav .lupa span{color:#fff}
.cartfloat{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;width:calc(100% - 28px);max-width:392px;z-index:35;border:0;background:var(--red);color:#fff;border-radius:16px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(199,32,23,.4)}
.cartfloat .n{background:#fff;color:var(--red);border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:12.5px;margin-right:8px;padding:0 6px;font-weight:800}
.cartfloat.off{display:none}
.voo{position:fixed;z-index:60;width:22px;height:22px;border-radius:50%;background:var(--yellow);border:3px solid var(--red);pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.3)}

/* ---------- cabeçalho de página (abas) ---------- */
.pg-h{background:var(--dark);color:#fff;margin-top:-62px;padding:76px 18px 20px;border-radius:0 0 26px 26px}
.pg-h h1{font-family:var(--serif);font-weight:800;font-size:30px;margin:4px 0 2px;letter-spacing:-.4px}
.pg-h h1 em{font-style:normal;color:var(--yellow)}
.pg-h p{margin:0;color:#d9cdc3;font-size:13px}

/* ---------- cardápio: linhas ---------- */
.cardapio section.cat-sec h2{font-family:var(--serif);font-size:21px;font-weight:800}
.it{display:flex;gap:12px;background:#fff;border-radius:18px;padding:10px;margin-bottom:10px;align-items:stretch;width:100%;text-align:left;color:inherit;position:relative;box-shadow:0 3px 10px rgba(80,40,20,.06);cursor:pointer;border:0}
.it.esg{opacity:.55}
.it .thumb{width:92px;height:92px;border-radius:14px;background:radial-gradient(90% 90% at 50% 35%,#3a2a25 0%,var(--dark) 78%)}
.it .thumb svg{width:78px;height:78px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.it .txt{flex:1;min-width:0;display:flex;flex-direction:column;padding-right:4px}
.it h3{margin:0 0 3px;font-size:15px;font-weight:700;line-height:1.2}
.it p{margin:0;color:var(--ink2);font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .price{margin-top:auto;padding-top:6px;font-weight:800;font-size:15px;padding-right:42px}
.it .price small{font-weight:500;color:var(--ink2);font-size:11px}
.it .price s{color:#a39891;font-weight:500;font-size:12px;margin-left:4px}
.it .addb{position:absolute;right:10px;bottom:10px}
.dica{margin:0 0 12px;background:#fff4f2;border:1.5px solid #f7c9c5;border-radius:14px;padding:10px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center;color:var(--red-d)}
.dica .mini-d{width:40px;height:40px;flex:none}

/* ---------- busca ---------- */
.busca-box{margin:-26px 16px 0;position:relative;z-index:5}
.busca-box input{width:100%;border:0;border-radius:16px;padding:16px 16px 16px 48px;font:inherit;font-size:16px;background:#fff;color:var(--ink);box-shadow:0 10px 26px rgba(26,20,20,.16);outline:2px solid transparent}
.busca-box input:focus{outline-color:var(--red)}
.busca-box svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--red)}
.sugest{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 0}
.sugest button{border:1.5px solid #efe4da;background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink)}
.sugest button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.res-h{padding:16px 16px 8px;font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.3px}
.res{padding:0 16px}
.res mark{background:#ffe98a;color:inherit;border-radius:3px;padding:0 1px}
.vazio{text-align:center;padding:26px 16px;color:var(--ink2);font-size:13.5px}

/* ---------- produto ---------- */
.pd-capa{background:var(--dark);margin-top:-62px;padding:66px 16px 34px;position:relative;overflow:hidden;display:grid;place-items:center}
.pd-capa:before{content:"";position:absolute;left:50%;top:55%;width:360px;height:360px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(246,42,37,.42) 0%,rgba(246,42,37,0) 65%)}
.pd-arte{position:relative;width:230px;height:230px}
.pd-arte svg{width:100%;height:100%;filter:drop-shadow(0 18px 20px rgba(0,0,0,.6))}
.pd-arte.gira{animation:giraIn .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes giraIn{from{transform:rotate(-70deg) scale(.85)}to{transform:none}}
.metades{position:relative;display:flex;gap:8px;margin-top:12px;z-index:2}
.metades span{background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
.pd-folha{background:var(--bg);margin-top:-22px;border-radius:26px 26px 0 0;position:relative;padding:20px 16px 8px}
.pd-folha h1{font-family:var(--serif);font-weight:800;font-size:28px;margin:2px 0 4px;letter-spacing:-.4px;line-height:1.08}
.pd-folha .desc{margin:0 0 14px;color:var(--ink2);font-size:13.5px}
.bloco{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(80,40,20,.05)}
.bloco h3{margin:0 0 10px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segs button{border:2px solid #efe4da;background:#fff;border-radius:14px;padding:9px 4px;text-align:center;color:var(--ink)}
.segs button b{display:block;font-size:14px}
.segs button small{display:block;font-size:11px;color:var(--ink2)}
.segs button em{display:block;font-style:normal;font-weight:800;font-size:13px;margin-top:3px}
.segs button.on{border-color:var(--red);background:#fff4f2}
.modo{display:grid;grid-template-columns:1fr 1fr;background:#f3ece6;border-radius:12px;padding:3px;margin-bottom:10px}
.modo button{border:0;background:none;border-radius:10px;padding:8px;font-weight:700;font-size:13px;color:var(--ink2)}
.modo button.on{background:var(--dark);color:#fff}
.meias{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.meias button{border:2px solid #efe4da;background:#fff;border-radius:12px;padding:8px 10px;text-align:left;color:var(--ink);font-size:13px;font-weight:700;line-height:1.2}
.meias button small{display:block;font-size:10.5px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.meias button.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(246,42,37,.14)}
.disco-mini{display:flex;gap:12px;align-items:center;background:var(--dark);color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:10px}
.disco-mini span{width:64px;height:64px;flex:none;display:block}
.disco-mini span.gira{animation:giraIn .55s cubic-bezier(.3,1.4,.5,1)}
.disco-mini svg{width:64px;height:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.disco-mini p{margin:0;font-size:12.5px;line-height:1.35;color:#e7dcd3}
.disco-mini b{color:var(--yellow)}
.sabores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sabores button{border:1.5px solid #efe4da;background:#fff;border-radius:12px;padding:7px 8px;display:flex;gap:8px;align-items:center;text-align:left;color:var(--ink);font-size:12.5px;font-weight:600;line-height:1.2;position:relative}
.sabores button svg{width:32px;height:32px;flex:none}
.sabores button.on{border-color:var(--red);background:#fff4f2}
.sabores button .n{position:absolute;top:-7px;right:-5px;width:19px;height:19px;border-radius:50%;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.chipsx{display:flex;flex-wrap:wrap;gap:8px}
.chipsx button{border:1.5px solid #efe4da;background:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
.chipsx button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.pd-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;z-index:40;background:#fff;display:flex;gap:10px;align-items:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.12);border-radius:22px 22px 0 0}
.pd-bar .qty button{width:36px;height:36px;border-radius:50%}
.pd-bar .big{flex:1;padding:13px 16px}
.bottom-cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;z-index:40;background:var(--bg);padding:10px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(0,0,0,.08)}

/* ---------- telas internas herdadas: cara nova ---------- */
.top{background:var(--dark);border-bottom:0;color:#fff}
.top h2{color:#fff}
.top button.back{background:rgba(255,255,255,.12);color:#fff;border-radius:50%;width:38px;height:38px}
.card{border:0;box-shadow:0 2px 8px rgba(80,40,20,.05);border-radius:18px}
.big{border-radius:14px}
.mini{background:var(--dark)!important}

/* ---------- pedidos / acompanhamento ---------- */
.acomp{background:var(--dark);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.acomp small{color:#cfc4bb;font-size:11.5px;letter-spacing:.3px}
.acomp h3{font-family:var(--serif);font-size:25px;font-weight:800;margin:2px 0 2px}
.acomp h3 em{font-style:normal;color:var(--yellow)}
.trilho{position:relative;height:8px;background:#3a2e2b;border-radius:4px;margin:14px 6px 8px}
.trilho i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--yellow),var(--red));border-radius:4px}
.marcos{display:flex;justify-content:space-between;font-size:10px;color:#a99d94;margin:0 -2px}
.marcos span{width:20%;text-align:center}
.marcos span.ok{color:#fff;font-weight:700}
.steps li.now .dot{animation:pulsa 1.4s infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 9px rgba(246,42,37,.05)}}
.pedrow{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(80,40,20,.05)}
.pedrow .d{flex:1;min-width:0;font-size:13px}
.pedrow .d b{display:block;font-size:14px}
.pedrow .d small{color:var(--ink2)}
.perfil-av{width:64px;height:64px;border-radius:50%;background:#3a2e2b;display:grid;place-items:center;color:#cfc4bb;margin-bottom:10px}
.perfil-av svg{width:34px;height:34px}
.lista{background:#fff;border-radius:18px;box-shadow:0 2px 8px rgba(80,40,20,.05);overflow:hidden;margin-bottom:12px}
.lista button{width:100%;border:0;background:none;display:flex;gap:12px;align-items:center;padding:14px;text-align:left;border-top:1px solid #f3ece6;color:var(--ink)}
.lista button:first-child{border-top:0}
.lista button .ic{width:36px;height:36px;border-radius:12px;background:#f8efe8;display:grid;place-items:center;color:var(--red-d);flex:none}
.lista button .ic svg{width:19px;height:19px}
.lista button span{flex:1;font-size:14px;font-weight:600}
.lista button span small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.lista button .chev{color:#c2b6ad;font-size:20px}
/* v4 */
.num{display:inline-block;align-self:flex-start;background:var(--dark,#1a1414);color:var(--yellow);border-radius:6px;font-size:10px;font-weight:800;padding:1px 6px;margin-bottom:3px;letter-spacing:.3px}
.pd-folha .num{margin-bottom:6px}
.conf{display:inline-block;background:#fff4d6;color:#8a5a00;border:1px dashed #d9a93c;border-radius:6px;font-size:9.5px;font-weight:800;padding:0 5px;margin-left:5px;vertical-align:2px;text-transform:uppercase;letter-spacing:.3px}
.conf-n{background:#fff8e6;border:1px dashed #d9a93c;border-radius:10px;padding:8px 10px;color:#6b4a00}
.cardapio section.cat-sec h3.grp{font-family:var(--serif);font-size:16px;font-weight:800;margin:16px 0 8px;padding-left:10px;border-left:4px solid var(--red)}
.tam-unico{display:flex;align-items:baseline;gap:10px;border:2px solid var(--red);background:#fff4f2;border-radius:14px;padding:10px 12px}
.tam-unico b{font-size:15px} .tam-unico span{color:var(--ink2);font-size:12.5px} .tam-unico em{margin-left:auto;font-style:normal;font-weight:800;font-size:15px}
.ilus{display:inline-block;background:#efe9ff;color:var(--ex);border:1px dashed #b9a4ff;border-radius:6px;padding:0 5px;font-size:9.5px;font-weight:800;letter-spacing:.3px;vertical-align:1px;text-transform:uppercase}
.toast{bottom:150px;border-radius:14px}

/* v6: foto real + logo */
img.foto{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.thumb img.foto{border-radius:14px}
.it .thumb:has(img.foto){background:none}
.mpc-img img.foto{position:absolute;inset:0}
.cc .cc-img{width:62px;height:52px;border-radius:12px;overflow:hidden}
.dn-pics span{overflow:hidden}
.cb-arte{border-radius:50%;overflow:hidden;width:150px;height:150px;right:-10px;bottom:-6px;border:4px solid #fff;box-shadow:0 10px 18px rgba(0,0,0,.45)}
.a-burger{border-radius:50%;overflow:hidden;border:4px solid #fff}
.pd-arte:has(img.foto){width:100%;max-width:360px;height:250px;border-radius:22px;overflow:hidden;box-shadow:0 14px 24px rgba(0,0,0,.45)}
.logo-pop{width:54px;height:54px;border-radius:50%;display:block;margin:0 auto;box-shadow:0 0 0 2px #fff}
.selo-r,.direto,.promo .kick{color:#fff}
.selo-r b,.direto b{color:#fff}
.direto .d-ic{color:#fff;background:#0b0b0b}
.nav .lupa.on i{color:#fff}
.foto-cred{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:9.5px;padding:2px 7px;border-radius:999px}

/* v8: comanda + pedida do dia */
.pedida{margin:18px 0 12px;width:calc(100% / .74)}   /* a capa-txt tem 74%: o bloco ocupa a largura toda da capa */
.pd-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;cursor:pointer;
  background:var(--red);color:#fff;border-radius:18px;padding:10px 14px 10px 10px;box-shadow:0 10px 22px rgba(246,42,37,.38);font:inherit}
.pd-card img{width:74px;height:74px;border-radius:14px;object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.9)}
.pd-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pd-txt small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.95}
.pd-txt b{font-size:14.5px;line-height:1.2;font-weight:700}
.pd-preco{font-family:var(--serif);font-weight:900;font-size:22px;line-height:1.1;margin-top:2px}
.pd-quero{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;white-space:nowrap;background:#0b0b0b;border-radius:999px;padding:7px 11px}
.pd-quero svg{width:14px;height:14px}
.pd-pontos{display:flex;gap:6px;justify-content:center;margin-top:8px}
.pd-pontos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.pd-pontos i.on{background:#fff}

/* v9: capa so com a logo (audio 3328) */
.a-logo{position:absolute;right:6px;top:86px;width:140px;height:140px;pointer-events:none;
  mix-blend-mode:lighten}  /* o blend fica NO BLOCO, sem z-index proprio isolando: o preto do jpg some no fundo da capa */
.a-logo img{width:100%;height:100%;object-fit:contain;animation:logoRespira 5.5s ease-in-out infinite}
@keyframes logoRespira{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.04) rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){.a-logo img{animation:none;transform:rotate(-4deg)}}
.capa:after{background:linear-gradient(90deg,rgba(26,20,20,.96) 0%,rgba(26,20,20,.6) 50%,rgba(26,20,20,0) 66%)}

/* v10: montagem do lanche com escolha obrigatoria (audio 3338) */
.chipsx button.completo{flex-basis:100%;text-align:left;border-color:#171212}
.quer-tirar{margin:12px 0 8px;font-weight:700}
.quer-tirar.faltou span{color:var(--red)}
.tirar-lista.travada button{opacity:.38}
/* o "tremer" da alea (estilo.css dela, 15/09/2026, Cassiano): o que falta treme */
@keyframes tremer{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-6px)}30%,60%,90%{transform:translateX(6px)}}
.treme-falta{animation:tremer .45s ease-in-out 1}
@media (prefers-reduced-motion:reduce){.treme-falta{animation:none}}
</style>

<script>
/* ============ DESENHOS (SVG feito aqui — sem foto de terceiro, sem marca, sem letra) ============ */
const SV = inner => (typeof inner==="string" && inner.startsWith("IMG:")) ? `<img class="foto" src="${inner.slice(4)}" alt="" loading="lazy" decoding="async">` : `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
function gBurger(v={}){

}
function gPizza(c){
  let s = `<circle cx="50" cy="50" r="45" fill="#D9913D"/><circle cx="50" cy="50" r="45" fill="none" stroke="#C07A2E" stroke-width="2"/><circle cx="50" cy="50" r="38" fill="${c.base}"/>`;

  return s;

function gFritas(c={}){
  return `<g fill="#F7C948" stroke="#E0A92B" stroke-width="1"><rect x="30" y="14" width="7" height="44" rx="2" transform="rotate(-10 33 36)"/><rect x="40" y="9" width="7" height="48" rx="2"/><rect x="51" y="11" width="7" height="46" rx="2" transform="rotate(6 54 35)"/><rect x="61" y="15" width="7" height="42" rx="2" transform="rotate(13 64 37)"/><rect x="45" y="18" width="7" height="40" rx="2" transform="rotate(-5 48 38)"/></g>

  <path d="M24 44 h52 l-7 44 h-38z" fill="#E4262A"/><path d="M27 52 h46" stroke="#fff" stroke-width="3"/><circle cx="50" cy="69" r="7" fill="#fff"/><circle cx="50" cy="69" r="4" fill="#E4262A"/>`;

  return s + `<path d="M8 52 h84 q-4 30 -42 30 q-38 0 -42 -30z" fill="#fff" stroke="#E3D8CE" stroke-width="2"/><path d="M13 60 h74" stroke="#E4262A" stroke-width="3"/>`;
}
function gAcai(v={}){

  ${v.trufado?'<path d="M25 56 h50 l-1 6 h-48z" fill="#F4ECDD"/><path d="M26 68 h48 l-1 5 h-46z" fill="#4a2616"/>':''}

}

  <rect x="32" y="48" width="36" height="18" rx="3" fill="#fff" opacity=".92"/><rect x="38" y="28" width="4" height="54" rx="2" fill="#fff" opacity=".28"/>`;

function gDog(){
  return `<path d="M10 58 q0 -14 16 -14 h48 q16 0 16 14 q0 14 -16 14 h-48 q-16 0 -16 -14z" fill="#E3A04A"/><rect x="7" y="47" width="86" height="12" rx="6" fill="#B8432F"/>

function gSanduiche(v={}){  /* pão de forma (bauru) */

/* desenho de cada sabor de pizza (cores = ingredientes do print; é desenho, não foto) */
const PZ = {
  americana:{base:"#F2CD6A",cob:["#E7B8A8","#FFF3C4","#E2412F"],gota:1},
  hotdog:{base:"#F2CD6A",cob:["#C0553A","#F7D23E","#F2B54A"]},

const ITENS = [];
CARDAPIO.categorias.forEach(c=>{
  if (c.grupo_app==="adicionais") return;
  c.itens.forEach(x=>{
    const base = {id:x.id, cat:c.grupo_app, grupo:c.id, nome:x.nome, desc:x.desc||"", num:x.num||null, conferir:x.CONFERIR||""};
    if (c.grupo_app==="pizzas") ITENS.push({...base, tipo:"pizza", preco:PIZZA.preco, doce:!!x.doce});
    else if (x.tamanhos){
      const d = base.desc || (x.sabores ? "Sabores: "+x.sabores.join(", ")+"." : x.tamanhos.map(t=>t.nome+" "+BRL0(t.preco)).join(" · "));
      ITENS.push({...base, desc:d, tipo:"variante", tams:x.tamanhos, sabores:x.sabores||null, preco:Math.min(...x.tamanhos.map(t=>t.preco))});
    }
    else if (c.grupo_app==="lanches") ITENS.push({...base, tipo:"lanche", preco:x.preco});
    else ITENS.push({...base, tipo:"simples", preco:x.preco, lanche:x.lanche||null});

function arteDe(it){
  if (FOTO[it.id] && it.tipo!=="pizza") return "IMG:fotos/"+FOTO[it.id]+".jpg";
  const d = (it.nome+" "+it.desc).toLowerCase();
  if (it.tipo==="pizza") return pzArte(it.id);
  if (it.cat==="lanches"){
    if (it.id==="misto") return gFrances({recheio:"#F4A6A0"});
    if (it.id.startsWith("churras")) return gFrances({recheio:it.id==="churrasfile"?"#6B3A1F":"#D9A560", cebola:1});
    if (it.id.startsWith("bauru")) return gSanduiche({tomate:d.includes("tomate"), bacon:d.includes("bacon"), ovo:d.includes("ovo")});
    const patty = it.id==="xvegetariano" ? "#58B947" : d.includes("filé mignon") ? "#4E2A16" : d.includes("frango") ? "#D9A560" : d.includes("calabresa") ? "#A63A2A" : undefined;
    return gBurger({patty, bacon:d.includes("bacon"), ovo:d.includes("ovo"), tomate:d.includes("tomate")});
  }
  if (it.cat==="porcoes"){
    if (it.id.startsWith("batata")) return gFritas({cheddar:d.includes("cheddar")||d.includes("bacon")||d.includes("mussarela")||d.includes("calabresa")});
    if (it.id==="calabresaacebolada") return gTigela(["#B8432F","#C8553F","#F3E2B8"]);
    if (it.id==="fileacebolado") return gTigela(["#6B3A1F","#4E2A16","#F3E2B8"]);
    return gTigela(["#D48A3C","#C27A30","#E09A48"]);
  }
  if (it.cat==="combos") return null;          /* gCombo, logo abaixo */
  if (it.id==="suco") return gCopo("#F7A21E",{fruta:"#F7C948"});
  if (it.id==="creme") return gCopo("#F2B8C6",{creme:1});
  const b = BEB[it.id] || ["l","#E4262A"];
  return b[0]==="g" ? gGarrafa(b[1], b[2]) : b[0]==="c" ? gCopo(b[1]) : gLata(b[1]);
}

function qrSvg(seed){
  let x = seed, r = () => (x = (x*1103515245+12345) & 0x7fffffff) / 0x7fffffff;
  const n=25, c=[];
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){
    const fin = (i<7&&j<7)||(i<7&&j>n-8)||(i>n-8&&j<7);
    let on;
    if (fin){ const a=i<7?i:i-(n-7), b=j<7?j:j-(n-7); on = a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4); }
    else on = r()>0.52;
    if (on) c.push(`<rect x="${j}" y="${i}" width="1" height="1"/>`);
  }
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><g fill="#111">${c.join("")}</g></svg>`;
}

/* DETALHE d: o item voa até o carrinho e o contador pula */
function voar(origem){
  const alvo = $("#cartbtn");
  if (!origem || !alvo || !origem.getBoundingClientRect){ atualizaCarrinhoUI(true); return; }
  const a = origem.getBoundingClientRect(), b = alvo.getBoundingClientRect();
  const d = document.createElement("div"); d.className = "voo";
  d.style.left = (a.left + a.width/2 - 11) + "px"; d.style.top = (a.top + a.height/2 - 11) + "px";
  document.body.appendChild(d);
  const dx = (b.left + b.width/2) - (a.left + a.width/2), dy = (b.top + b.height/2) - (a.top + a.height/2);
  const fim = () => { d.remove(); atualizaCarrinhoUI(true); };
  if (!d.animate){ fim(); return; }
  const an = d.animate([
    {transform:"translate(0,0) scale(1)"},
    {transform:`translate(${dx*0.35}px,${Math.min(dy,0)-70}px) scale(1.25)`, offset:.45},
    {transform:`translate(${dx}px,${dy}px) scale(.35)`, opacity:.7}
  ], {duration:700, easing:"cubic-bezier(.45,0,.4,1)"});
  an.onfinish = fim;
}
function juntaNoCarrinho(l){
  const igual = S.carrinho.find(x=>x.id===l.id && x.nome===l.nome && x.det===l.det && x.pu===l.pu);

  juntaNoCarrinho({id, nome:it.nome, det:"", qtd:1, pu:it.preco});
  const cf = $("#cartfloat"); if (cf) { cf.classList.remove("off"); }
  voar(ev && ev.currentTarget);

/* ============ TELA: BUSCA (a lupa do meio) ============ */
/* v4: busca sem acento ("file" acha "filé") e pelo nome da categoria ("pizza" acha os 22 sabores) */
const semAc = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function marca(txt, termo){
  const t = esc(txt); if (!termo) return t;
  const i = semAc(txt).indexOf(semAc(termo)); if (i<0) return t;
  return esc(txt.slice(0,i)) + "<mark>" + esc(txt.slice(i,i+termo.length)) + "</mark>" + esc(txt.slice(i+termo.length));
}
const SUGESTOES = ["calabresa","x-tudo","filé","frango","bacon","chocolate","batata","combo","maracujá"];
function resultados(q){
  const t = q.trim().toLowerCase();
  if (!t) return `<div class="res-h">DESTAQUES</div><div class="res">${["xtudo","calabresa","batatabaconcheddar","combobacon"].map(id=>linhaItem(item(id))).join("")}</div>`;
  const achou = ITENS.filter(i=>semAc(i.nome+" "+i.desc+" "+CATS.find(c=>c.id===i.cat).nome+" "+(i.grupo?TITULO_GRUPO[i.grupo]||"":"")).includes(semAc(t)));
  if (!achou.length) return `<div class="vazio">Nada com “${esc(q)}” no cardápio.<br>Tenta “pizza”, “x-bacon” ou “suco”.</div>`;
  return `<div class="res-h" id="res-n">${achou.length} ${achou.length===1?"ITEM":"ITENS"} COM “${esc(q.trim()).toUpperCase()}”</div><div class="res">${achou.map(i=>linhaItem(i,t)).join("")}</div>`;
}

/* ============ TELA: PRODUTO (DETALHE b: disco meia a meia) ============ */
let _disco = 0, _discoUlt = "";
function discoSvg(sab){
  if (sab.length<2) return pzArte(sab[0]);
  const k = ++_disco;
  return `<defs><clipPath id="dL${k}"><rect x="0" y="0" width="50" height="100"/></clipPath><clipPath id="dR${k}"><rect x="50" y="0" width="50" height="100"/></clipPath></defs>
    <g clip-path="url(#dL${k})">${pzArte(sab[0])}</g><g clip-path="url(#dR${k})">${pzArte(sab[1])}</g>
    <line x1="50" y1="4" x2="50" y2="96" stroke="#fff" stroke-width="1.6" stroke-dasharray="3 2.4"/>`;
}
function telaProduto(id){
  const it = item(id);
  if (!it) return telaInicio();
  if (montagem.id!==id) montagem = {id, sabores:[id], ativa:0, tirar:[], add:[], tamIx:0, sabor:null, qtd:1, obs:"", completo:false, querTirar:false, molhos:[]};
  const m = montagem;
  let h = strip() + topoVolta(CATS.find(c=>c.id===it.cat).nome, S.voltar);
  let arte = SV(it.art), chave = it.id;
  if (it.tipo==="pizza"){ arte = SV(discoSvg(m.sabores)); chave = m.sabores.join("|"); }
  const gira = it.tipo==="pizza" && _discoUlt.startsWith(it.id+"#") && _discoUlt!==it.id+"#"+chave;
  chave = it.id+"#"+chave;
  _discoUlt = chave;
  h += `<div class="pd-capa"><div class="pd-arte ${gira?"gira":""}" id="disco">${arte}</div>
    ${it.tipo==="pizza"&&m.sabores.length===2?`<div class="metades"><span>◐ ${esc(item(m.sabores[0]).nome)}</span><span>${esc(item(m.sabores[1]).nome)} ◑</span></div>`:""}</div>`;

/* ============ GESTÃO — dados de EXEMPLO (semente fixa, a partir do cardápio fictício) ============ */
function gerarExemplo(){
  let x = 20260925; const r = () => (x = (x*1664525+1013904223) >>> 0) / 4294967296;
  const pick = w => { const t=w.reduce((a,b)=>a+b,0); let a=r()*t, s=0; for(let i=0;i<w.length;i++){ s+=w[i]; if(a<=s) return i; } return w.length-1; };
  const pesoBairro=[30,16,14,12,11,9,8], tempoBase=[28,34,39,40,45,49,53];
  /* v4: itens e preços reais; a QUANTIDADE vendida continua sendo exemplo (sem dado de venda do POP) */
  const MIX=[["xtudo",14],["frangocatupiry",12],["combobacon",10],["batatabaconcheddar",9],["xbacon",8],["calabresa",7],["combofrango",8],["xsalada",6],["suco",6],["coca2l",8],["cocalata",9],["chocolate",4],["quatroqueijos",4],["xfilematador",3],["batatafrita",3],["xblaster",3]];
  const precoMix = id => item(id).preco;
  const horas=[18,19,20,21,22,23,0], pesoHora=[7,15,22,21,16,12,7];
  const pesoDia=[0.72,0.78,0.86,0.95,1.25,1.42,1.12];
  const out=[];
  for (let d=0; d<60; d++){
    const dow=(d+1)%7;                       // d=59 = hoje (sexta)
    const n = Math.round(24*pesoDia[dow]*(1+d*0.004)*(0.88+r()*0.24));
    for (let k=0;k<n;k++){
      const b = pick(pesoBairro), hr = horas[pick(pesoHora)];
      const ni = 1 + pick([50,35,15]); const its=[];
      for (let j=0;j<ni;j++) its.push(MIX[pick(MIX.map(m=>m[1]))][0]);
      const sub = its.reduce((a,id)=>a+precoMix(id),0);
      const tx = (b===0 && sub>=60) ? 0 : BAIRROS[b].tx;
      const tAceite = 1 + Math.floor(r()*4), tCoz = 13 + Math.floor(r()*12), tRua = Math.max(8, tempoBase[b]-tCoz-tAceite + Math.floor(r()*9) - 3);
      out.push({dia:d, dow, bairro:BAIRROS[b].n, hora:hr, valor:sub+tx, its, pag:r()<0.71?"pix":"credito",
        cancel:r()<0.025, tAceite, tCoz, tRua, total:tAceite+tCoz+tRua, origem:["Instagram","Google","WhatsApp","Direto"][pick([41,24,22,13])]});
    }
  }
  return out;
}

  const dias = +S.periodo;
  const base = EXEMPLO.filter(o=>o.dia >= 60-dias), prev = EXEMPLO.filter(o=>o.dia >= 60-2*dias && o.dia < 60-dias);
  const ok = base.filter(o=>!o.cancel), okp = prev.filter(o=>!o.cancel);
  const soma = l => l.reduce((a,o)=>a+o.valor,0);
  const vendas = soma(ok), vendasP = soma(okp);
  const ticket = ok.length ? vendas/ok.length : 0, ticketP = okp.length ? vendasP/okp.length : 0;
  const tMed = ok.length ? ok.reduce((a,o)=>a+o.total,0)/ok.length : 0;
  const pix = ok.filter(o=>o.pag==="pix").length, canc = base.length - ok.length;
  const hoje = EXEMPLO.filter(o=>o.dia===59 && !o.cancel);
  const vivos = S.pedidos.filter(p=>p.estado!=="entregue" && p.estado!=="cancelado");
  let h = strip();
  h += `<div class="g-head"><h1>Painel do POP</h1><p>O que o dono vê no celular: a noite agora em cima, os números embaixo.</p>
    <div class="g-live"><div><b>${vivos.length}</b><span>em andamento</span></div><div><b>${S.pedidos.filter(p=>p.estado==="pago").length}</b><span>esperando aceite</span></div><div><b>${brl(soma(hoje))}</b><span>vendido hoje ${EX}</span></div></div></div>`;
  h += `<div class="g-sec"><h2>Pedidos agora <small>toca até alguém aceitar</small></h2>`;
  for (const p of S.pedidos){
    const acts = {
      aguardando:`<span class="note">esperando o cliente pagar…</span>`,
      pago:`<button class="ok" onclick="avanca('${p.num}','aceito')">Aceitar e imprimir</button><button class="x" onclick="cancela('${p.num}')">Recusar e estornar</button>`,
      aceito:`<button onclick="avanca('${p.num}','cozinha')">Foi pra cozinha</button><button class="x" onclick="toast('Reimpressão sai marcada como 2ª via — a cozinha não faz em dobro.')">Reimprimir</button>`,
      cozinha:`<button onclick="avanca('${p.num}','saiu')">Saiu pra entrega</button><button class="x" onclick="toast('Faltou item depois de pago: o painel oferece troca antes de estornar.')">Faltou item</button>`,
      saiu:`<button class="ok" onclick="avanca('${p.num}','entregue')">Entregue</button>`,
      entregue:`<span class="note">concluído</span>`, cancelado:`<span class="note">estorno acompanhado até cair</span>`
    }[p.estado];
    h += `<div class="ord ${p.estado==="pago"?"ring":""}"><div class="h"><span>${p.num} <span class="st ${p.estado}">${ESTADOS.find(e=>e.k===p.estado)?.t || "Cancelado"}</span></span><span>${brl(p.total)}</span></div>
      <div class="m">${p.itens.map(x=>x.qtd+"× "+esc(x.nome)).join(" · ")}<br>${esc(p.bairro)} · ${p.pag==="pix"?"Pix":"Crédito"} · pago às ${p.hist.pago||"—"}${p.impresso?" · 🖨 impresso":""}</div>
      <div class="acts">${acts}</div></div>`;
  }
  h += `</div>`;
  const ctlIds = ["xtudo","frangocatupiry","combobacon","batatabaconcheddar","suco","fileacebolado","xpica"];
  h += `<div class="g-sec"><h2>Controles da loja</h2><div class="card">
      <div class="ctl"><span><b>Pausar pedidos</b><br><small style="color:var(--ink2)">cozinha cheia: o site para de cobrar</small></span><button class="tog red ${S.pausada?"on":""}" onclick="S.pausada=!S.pausada;render()"></button></div>
      ${ctlIds.map(item).map(i=>`<div class="ctl"><span>${esc(i.nome)} ${S.esgotado[i.id]?'<span class="tag-esg">ESGOTADO</span>':""}</span><button class="tog ${S.esgotado[i.id]?"":"on"}" onclick="S.esgotado['${i.id}']=!S.esgotado['${i.id}'];render()"></button></div>`).join("")}
      <p class="note">Verde = à venda. Desligou aqui, o item sai do botão de comprar na hora.</p></div></div>`;
  h += `<div class="ex-banner">📊 <b>Daqui pra baixo, números de EXEMPLO</b> — mostram a tela pronta, não o POP. No site real eles saem sozinhos dos pedidos pagos.</div>`;
  h += `<div class="chips">${[["1","Hoje"],["7","7 dias"],["30","30 dias"]].map(([v,t])=>`<button class="${S.periodo===v?"on":""}" onclick="S.periodo='${v}';render()">${t}</button>`).join("")}</div>`;
  const vs = dias===1?"vs ontem":dias===7?"vs 7 dias antes":"vs 30 dias antes";
  h += `<div class="kpis">
      <div class="kpi"><div class="l">Vendas ${EX}</div><div class="v">${brl(vendas)}</div><div class="s">${delta(vendas,vendasP)} ${vs}</div></div>
      <div class="kpi"><div class="l">Pedidos pagos ${EX}</div><div class="v">${ok.length}</div><div class="s">${delta(ok.length,okp.length)} ${vs}</div></div>
      <div class="kpi"><div class="l">Ticket médio ${EX}</div><div class="v">${brl(ticket)}</div><div class="s">${delta(ticket,ticketP)} ${vs}</div></div>
      <div class="kpi"><div class="l">Tempo de entrega ${EX}</div><div class="v">${Math.round(tMed)} min</div><div class="s">do pago ao entregue</div></div>
      <div class="kpi"><div class="l">Pix × crédito ${EX}</div><div class="v">${ok.length?Math.round(pix/ok.length*100):0}% Pix</div><div class="s">dinheiro na conta na hora</div></div>
      <div class="kpi"><div class="l">Cancelados ${EX}</div><div class="v">${canc}</div><div class="s">${base.length?(canc/base.length*100).toFixed(1).replace(".",","):0}% dos pedidos</div></div>
    </div>`;
  /* faturamento por dia */
  const ult = Array.from({length:30},(_,i)=>30+i), fd = ult.map(d=>soma(EXEMPLO.filter(o=>o.dia===d&&!o.cancel))), fmax = Math.max(...fd);
  const dataDe = d => { const t=new Date(); t.setDate(t.getDate()-(59-d)); return String(t.getDate()).padStart(2,"0")+"/"+String(t.getMonth()+1).padStart(2,"0"); };
  h += `<div class="g-sec"><h2>Faturamento por dia ${EX} <small>últimos 30 dias</small></h2><div class="card"><div class="vbars thin">${ult.map((d,i)=>`<div class="c ${fd[i]===fmax?"pk":""}"><i style="height:${fd[i]/fmax*92}%"></i><span>${i%6===0?dataDe(d):""}</span></div>`).join("")}</div>
      <p class="note">Os picos são sexta e sábado — é onde escalar mais um motoboy.</p></div></div>`;
  /* mais vendidos */
  const cont = {}; ok.forEach(o=>o.its.forEach(id=>cont[id]=(cont[id]||0)+1));
  const mv = Object.entries(cont).sort((a,b)=>b[1]-a[1]).slice(0,8); const mmax = mv.length?mv[0][1]:1;
  h += `<div class="g-sec"><h2>Mais vendidos ${EX}</h2><div class="card bars">${mv.map(([id,v])=>`<div class="b"><span class="nm">${esc(item(id).nome)}</span><div class="track"><div class="fill" style="width:${v/mmax*100}%"></div></div><span class="val">${v}</span></div>`).join("")}</div></div>`;
  /* bairro */
  const porB = BAIRROS.map(({n})=>{ const l=ok.filter(o=>o.bairro===n); const v=soma(l);
    return {b:n, n:l.length, v, tk:l.length?v/l.length:0, t:l.length?l.reduce((a,o)=>a+o.total,0)/l.length:0}; }).sort((a,c)=>c.v-a.v);
  h += `<div class="g-sec"><h2>Por bairro ${EX}</h2><div class="card" style="padding:8px 10px"><table class="t"><tr><th>Bairro</th><th class="r">Ped.</th><th class="r">Vendas</th><th class="r">Ticket</th><th class="r">Tempo</th></tr>
      ${porB.map(x=>`<tr><td>${esc(x.b)}</td><td class="r">${x.n}</td><td class="r">${num(x.v)}</td><td class="r">${num(x.tk)}</td><td class="r">${Math.round(x.t)}′</td></tr>`).join("")}
      </table><p class="note">Bairro longe = entrega mais demorada: daqui sai a taxa certa de cada bairro.</p></div></div>`;
  /* etapas */
  const avg = k => ok.length ? ok.reduce((a,o)=>a+o[k],0)/ok.length : 0;
  const et = [["Pago → aceito", avg("tAceite")],["Aceito → saiu", avg("tCoz")],["Saiu → entregue", avg("tRua")]]; const mx = Math.max(...et.map(e=>e[1]));
  h += `<div class="g-sec"><h2>Onde o tempo vai ${EX}</h2><div class="card bars">${et.map(e=>`<div class="b"><span class="nm">${e[0]}</span><div class="track"><div class="fill" style="width:${e[1]/mx*100}%;background:var(--gold)"></div></div><span class="val">${Math.round(e[1])} min</span></div>`).join("")}
      <p class="note">Separa balcão, cozinha e rua: dá pra saber quem está atrasando.</p></div></div>`;
  /* horário */
  const horas = [18,19,20,21,22,23,0]; const ch = horas.map(hh=>ok.filter(o=>o.hora===hh).length); const cmax = Math.max(1,...ch);
  h += `<div class="g-sec"><h2>Pedidos por horário ${EX}</h2><div class="card"><div class="vbars">${horas.map((hh,i)=>`<div class="c ${ch[i]===cmax?"pk":""}"><em>${ch[i]}</em><i style="height:${ch[i]/cmax*80}%"></i><span>${String(hh).padStart(2,"0")}h</span></div>`).join("")}</div>
      <p class="note">O pico diz quantos motoboys escalar e a hora de pausar.</p></div></div>`;
  /* dia da semana */
  const dn = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"]; const cd = dn.map((_,i)=>soma(ok.filter(o=>o.dow===i))); const dmax=Math.max(1,...cd);
  h += `<div class="g-sec"><h2>Vendas por dia da semana ${EX}</h2><div class="card"><div class="vbars">${dn.map((d,i)=>`<div class="c ${cd[i]===dmax?"pk":""}"><em>${(cd[i]/1000).toFixed(1).replace(".",",")}k</em><i style="height:${cd[i]/dmax*80}%"></i><span>${d}</span></div>`).join("")}</div></div></div>`;
  /* funil + origem */
  const pagos = ok.length, fun = [["Entrou no site", Math.round(pagos*6.1)],["Abriu um item", Math.round(pagos*3.4)],["Pôs na comanda", Math.round(pagos*1.9)],["Foi pagar", Math.round(pagos*1.25)],["Pagou", pagos]];
  h += `<div class="g-sec"><h2>Funil do site ${EX}</h2><div class="card funnel">${fun.map(f=>`<div class="fs"><span>${f[0]}</span><div class="track"><div class="fill" style="width:${f[1]/fun[0][1]*100}%"></div></div><span style="text-align:right;font-weight:700">${f[1]}</span></div>`).join("")}
      <p class="note">Mostra onde o cliente desiste: no cardápio, na comanda ou na hora de pagar.</p></div></div>`;
  const org = {}; ok.forEach(o=>org[o.origem]=(org[o.origem]||0)+1); const oe = Object.entries(org).sort((a,b)=>b[1]-a[1]);
  h += `<div class="g-sec"><h2>De onde veio o pedido ${EX}</h2><div class="card bars">${oe.map(([n,v])=>`<div class="b"><span class="nm">${n}</span><div class="track"><div class="fill" style="width:${v/oe[0][1]*100}%;background:var(--green)"></div></div><span class="val">${pagos?Math.round(v/pagos*100):0}%</span></div>`).join("")}
      <p class="note">Pedido que veio de anúncio volta pro anúncio como venda — é assim que se sabe se o anúncio paga.</p></div></div>`;
  h += `<div class="selo-pe">🧪 <b>Proposta ilustrativa.</b> Todos os números desta tela são de exemplo, gerados pra mostrar o painel pronto — nenhum é do POP. Os itens e preços são os do cardápio real (story de 31/12/2025).</div>`;
  h += `<div class="foot">ZELES · Inteligência aplicada · prévia de app v4 · 27/09/2026</div>`;
  return h;
}
function avanca(num, est){
  const p = S.pedidos.find(x=>x.num===num); p.estado = est; p.hist[est]=hhmm();
  if (est==="aceito"){ p.impresso = true; toast("Aceito: comanda impressa na cozinha (simulado)."); }
  render();
}
function cancela(num){ const p=S.pedidos.find(x=>x.num===num); p.estado="cancelado"; toast("Recusado: estorno disparado. Pix volta em minutos; cartão, na fatura."); render(); }

/* ============ ROTEADOR (v3) ============ */
const ABAS = ["inicio","busca","pedidos","perfil"];
function render(){
  let h = (location.hash||"#inicio").slice(1);
  if (h==="loja" || h==="") h = "inicio";
  if (h==="cardapio") h = "cardapio-" + (S.catMenu||"tudo");
  const y = window.scrollY, mesma = render._ult===h;
  let html;
  if (h.startsWith("produto-")) { S.view="produto"; html = telaProduto(h.slice(8)); }
  else if (h.startsWith("cardapio-")) { S.view=h; html = telaCardapio(h.slice(9)); }
  else {
    S.view = h;
    html = ({inicio:telaInicio, busca:telaBusca, carrinho:telaCarrinho, checkout:telaCheckout, pix:telaPix, cartao:telaCartao,
      pedidos:telaPedidos, pedido:telaPedido, perfil:telaPerfil, gestao:telaGestao}[h] || (()=>{ S.view="inicio"; return telaInicio(); }))();
  }
  /* de onde o "voltar" do produto/carrinho volta */
  if (ABAS.includes(S.view) || S.view.startsWith("cardapio-")) S.voltar = S.view;
  const comNav = ABAS.includes(S.view) || S.view.startsWith("cardapio-") || S.view==="pedido";
  if (comNav) html += cartFloat() + nav();
  app.innerHTML = html;
  app.style.paddingBottom = comNav ? (qtdCarrinho() ? "170px" : "112px") : (["produto","carrinho"].includes(S.view) ? "110px" : "30px");
  if (mesma) window.scrollTo(0,y);
  render._ult = h;
  rolagem();
  if (S.pulaBadge){ S.pulaBadge = false; atualizaCarrinhoUI(true); }
  if (S.view==="busca" && !mesma){ const q=$("#q"); if(q && !S.semFoco) q.focus({preventScroll:true}); }
}
function rolagem(){ const t=$("#topo"); if (t && !t.classList.contains("solid")) t.classList.toggle("rolou", window.scrollY>30); }
window.addEventListener("scroll", rolagem, {passive:true});
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); rolagem(); });
render();

</script>
